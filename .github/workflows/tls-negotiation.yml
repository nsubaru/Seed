name: TLS negotiation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negotiate:
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.4xx
      - name: Build independent TLS peer
        run: dotnet build Tools/Seed.Tls.TestPeer/Seed.Tls.TestPeer.csproj --configuration Debug --nologo
      - name: Probe negotiation under an ordinary Windows account
        run: ./Tools/Invoke-SeedCiOrdinaryUser.ps1 -Configuration Debug -TlsProbe
      - name: Upload negotiation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tls-negotiation
          path: |
            Artifacts/tls-negotiation/**
            Artifacts/ci-ordinary-user*.log
